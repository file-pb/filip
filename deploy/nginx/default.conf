# Statická stránka. Port 8080 kvůli kontraktu platformy (http-service).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hlavičku Server maže až Traefikovo `bezpecne-hlavicky`. Tohle je
    # druhá vrstva — kdyby se ta stránka někdy servírovala i odjinud.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Kořen vede na výchozí jazyk. Dělá to server, ne aplikace: statický
    # export přesměrování za běhu neumí, a je to beztak věc serveru.
    # 302, ne 301 — kdyby se někdy výchozí jazyk měnil, 301 už by si
    # prohlížeče pamatovaly.
    location = / {
        return 302 /cs/;
    }

    # Kontrakt platformy. Obě cesty musí existovat, jinak Traefikova
    # kontrola zdraví kontejner vyřadí (a `/health` navíc hlídá Kuma).
    location = /health {
        default_type text/plain;
        return 200 "Healthy\n";
    }
    location = /health/ready {
        default_type text/plain;
        return 200 "Ready\n";
    }

    # Z jakého commitu je nasazená verze. Čte to nasazovací workflow,
    # aby produkci nevrátilo do minulosti.
    location = /verze {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Soubory Nextu mají v názvu otisk obsahu, takže se nikdy nemění pod
    # stejnou adresou a můžou se cachovat natrvalo.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML se cachovat nesmí dlouho, jinak se po nasazení neprojeví změna
    # textu. Statika je levná, tak ať se raději ptá.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
